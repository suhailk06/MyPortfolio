<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Nav · Active on Scroll</title>
    <style>
        /* ----- GLOBAL RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color:#02060E;
            color: white;
            padding-top: 80px;  
        }

        nav {
            position: fixed;
            top: 20px;      
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;     
            background-color: #010101; 
            padding: 0.9rem 2rem;
            border: 1px solid white;
            border-radius: 35px;
            width: auto;
            min-width: 320px;
            max-width: 90vw;
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
            z-index: 1000;
        }

        nav a {
            text-decoration: none;
            color: white;               /* default link color */
            font-weight: 500;
            letter-spacing: 0.3px;
            font-size: 1.1rem;
            padding: 0.25rem 0;
            transition: color 0.2s, opacity 0.2s;
        }

        /* hover stays as before */
        nav a:hover {
            opacity: 0.7;
            color: red;
        }

        /* active link – when section is in view */
        nav a.active {
            color: #ff3b3b;            /* bright red for active link */
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            position: relative;
        }

        /* small underline indicator (optional, clean look) */
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #ff3b3b;
            border-radius: 2px;
            box-shadow: 0 0 8px #ff0000;
        }

        nav h1 {
            background-color:#c50303;
            width:auto;
            height: auto;
            padding: 0.5rem 1rem;
            border-radius: 50px;
        }

        #home {
            height: 100vh;
        }

    </style>
</head>
<body>

    <nav>
        <h1>My Portfolio</h1>
        <a href="#home" class="nav-link active">Home</a>   <!-- initially active -->
        <a href="#about" class="nav-link">About</a>
        <a href="#skills" class="nav-link">Skills</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="#contact" class="nav-link">Contact</a>
    </nav>

    <div class="content">
        <section id="home">
            <h1>Home</h1>
        </section>

        <section id="about">
            <h1>About</h1>
        </section>
        <section id="skills">
            <h1>Skills</h1>
        </section>  
        <section id="projects">
            <h1>Projects</h1>   
        </section>
        <section id="contact">
            <h1>Contact</h1>
        </section>
    </div>

    <script>
        (function() {
            // Get all sections and nav links
            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('.nav-link');

            // Function to update active class based on scroll position
            function updateActiveLink() {
                let currentSectionId = 'home'; // default fallback

                // Find the section that is currently most visible in the viewport
                // We'll use a threshold: the section whose top is closest to the top of the viewport
                // but not past the middle, or simply the one that occupies most of the viewport.
                // A clean approach: find the section whose top is <= window.scrollY + some offset (e.g., 150px)
                // and whose bottom is > window.scrollY + offset.
                const scrollPosition = window.scrollY + 150; // offset for fixed nav + breathing room

                // Iterate from last to first to get the *first* section that contains the scroll position
                // Actually we want the section that contains the scroll position, if multiple, the one that started last
                // but let's go from bottom to top to get the last matching section? 
                // Better: loop and keep the last section whose top <= scrollPosition.
                let activeSection = sections[0]; // default home
                for (let i = 0; i < sections.length; i++) {
                    const section = sections[i];
                    const sectionTop = section.offsetTop;
                    const sectionBottom = sectionTop + section.offsetHeight;

                    // If the scroll position is within this section (with a little tolerance)
                    // We use a small offset for the bottom? Actually if scrollPosition is between top and bottom, that's it.
                    // But to handle the case where the section is shorter than viewport, we can check if scrollPosition is between top and bottom.
                    // Also consider that for the last section, scrolling to the bottom might not reach the exact bottom due to viewport height.
                    // So we also check if the section is the last one and we are near the bottom.
                    if (scrollPosition >= sectionTop && scrollPosition < sectionBottom) {
                        activeSection = section;
                    }
                    // Special case: if we are at the very bottom of the page, force last section active
                    if (i === sections.length - 1 && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) {
                        activeSection = section;
                    }
                }

                // If for some reason we didn't match any (e.g., scrollPosition less than first section top), fallback to first
                // Also handle the case where the first section's top is 0, scrollPosition is 150, so it will match first.
                // Update active class on nav links
                const currentId = activeSection.getAttribute('id');
                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${currentId}`) {
                        link.classList.add('active');
                    }
                });
            }

            // Also handle the case where the user clicks a nav link: the scroll event will fire,
            // but we also want to update immediately after the click for responsiveness.
            // However, smooth scroll will trigger multiple scroll events, which is fine.
            // But to avoid flicker, we can also set active on click as a quick preview.
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    // Don't prevent default – we want smooth scroll.
                    // But we can set active immediately for better UX.
                    navLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    // The scroll event will adjust correctly once the smooth scroll finishes.
                });
            });

            // Throttle the scroll event for performance (optional but nice)
            let ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        updateActiveLink();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // Initial call on page load
            window.addEventListener('load', updateActiveLink);
            // Also call on resize because section positions may change
            window.addEventListener('resize', updateActiveLink);
            // Small delay to ensure everything is rendered (just in case)
            setTimeout(updateActiveLink, 100);
        })();
    </script>
</body>
</html>
